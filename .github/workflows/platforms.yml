name: Desktop platforms
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Kein Zertifikat aus dem Runner-Keychain verwenden. Die Ad-hoc-Signierung
      # steuert `build.mac.identity: "-"` in package.json, unabhängig davon.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder überspringt die macOS-Signierung bei `pull_request`-Läufen
      # (GITHUB_BASE_REF gesetzt), sonst käme aus dem PR-Lauf eine unsignierte DMG,
      # während der Push-/Tag-Lauf desselben Commits eine signierte liefert. Der
      # Sicherheitsvorbehalt hinter diesem Schalter betrifft Signatur-Secrets im
      # Fork-PR – die Ad-hoc-Signierung braucht keine.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup macOS
        if: runner.os == 'macOS'
        run: bash setup-macos.sh
      - name: Setup Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup-windows.ps1
      - name: Setup Linux
        if: runner.os == 'Linux'
        run: bash setup-linux.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run dist
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: npm run verify-signature
      - name: Packaged app smoke test (macOS)
        if: runner.os == 'macOS'
        run: npm run smoke -- --packaged
      - name: Installed app smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'AI Chess Tutor'
          $result = Start-Process -FilePath $installer -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $env:CHESS_SMOKE_EXECUTABLE = Join-Path $destination 'AI Chess Tutor.exe'
          npm run smoke -- --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux package
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./dist/*.deb xvfb
      - name: Installed app smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          CHESS_SMOKE_EXECUTABLE: /usr/bin/ai-chess-tutor
        run: xvfb-run -a npm run smoke -- --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage

  # Runs only for a pushed tag like "v0.1.0" (the "v" plus the exact package.json
  # version) — draft, not published: the required signing/notarization note below
  # still needs a human to review and confirm the release text before it goes live.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: installers/*
          body: |
            ⚠️ Not notarized, no developer certificate: the macOS app carries a valid ad-hoc
            signature but no Apple notarization, the Windows installer is unsigned. macOS
            Gatekeeper and Windows SmartScreen therefore warn before first launch — see the
            README for how to allow the app.

            ⚠️ Nicht notarisiert, kein Entwicklerzertifikat: Die macOS-App trägt eine gültige
            Ad-hoc-Signatur, aber keine Apple-Notarisierung; der Windows-Installer ist
            unsigniert. macOS Gatekeeper und Windows SmartScreen warnen deshalb vor dem ersten
            Start — wie man die App freigibt, steht in der README.
